name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # her pazartesi: saatleri tazele
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Saatleri çek (başarısız olursa depodaki data.json kalır)
        timeout-minutes: 5
        continue-on-error: true
        run: node scripts/fetch.mjs || echo "Çekilemedi, mevcut data.json kullanılıyor"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Artifact'ın görünür olmasını bekle
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
